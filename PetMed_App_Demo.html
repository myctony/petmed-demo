<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetMed App Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F172A;--muted:#556070;--line:#E2E6EB;--soft:#EEF1F5;--ground:#F3F5F7;
  --food:#B45309;--foodT:#FEF3E7;--med:#7E22CE;--medT:#F4EBFC;--ok:#166534;--okT:#E8F5EC}
*{box-sizing:border-box}
html,body{margin:0;background:#DDE2E8;color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 12px}
.phone{width:390px;max-width:100%;height:844px;max-height:calc(100vh - 48px);position:relative;overflow:hidden;
  background:var(--ground);border-radius:36px;box-shadow:0 24px 70px rgba(15,23,42,.22);font-size:15px;line-height:1.45}
@media (max-width:430px){body{padding:0}.phone{border-radius:0;height:100vh;max-height:none;width:100%}}
button{font-family:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed}
input{font-family:inherit}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.6px}
p{margin:0}
.screen{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;padding:36px 28px 32px}
.content{position:absolute;top:0;left:0;right:0;bottom:76px;overflow-y:auto}
.pad{padding:28px 20px 24px;display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.cap{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.card{border-radius:20px;background:#fff;padding:16px}
.list{border-radius:20px;background:#fff;padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--soft)}
.row:last-child{border-bottom:0}
.chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.c-ok{background:var(--okT);color:var(--ok)} .c-warn{background:var(--foodT);color:#92400E}
.c-bad{background:#FDECEC;color:#991B1B} .c-idle{background:var(--soft);color:#334155}
.btn{height:50px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-size:15px;font-weight:700}
.btn:disabled{background:#94A3B8}
.btn-out{height:50px;border-radius:14px;border:1.5px solid var(--med);background:#fff;color:#6B21A8;font-size:15px;font-weight:700}
.dot{width:8px;height:8px;border-radius:4px;flex:none;display:inline-block}
.sq{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:20px;font-weight:700}
.sq:disabled{opacity:.4}
.note{border-radius:14px;padding:12px 14px;font-size:13.5px}
.n-warn{background:var(--foodT);color:#7C2D12;border:1px solid #F6D9B8}
.n-bad{background:#FDECEC;color:#7F1D1D;border:1px solid #F7CACA}
.bar{display:block;width:100%;height:6px;border-radius:3px;overflow:hidden}
.bar>span{display:block;height:100%;transition:width .4s}
.mini{text-align:left;border:0;border-radius:18px;background:#fff;padding:16px;display:flex;flex-direction:column;gap:8px}
nav{position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid var(--line);
  display:flex;padding:0 8px 10px;z-index:10}
nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;font-size:11px;font-weight:700;color:#64748B}
nav button[aria-current=page]{color:var(--ink)}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.slot{flex:1;height:44px;border-radius:12px;font-size:13px;font-weight:700}
.slot.on{background:var(--med);color:#fff;border:0}
.slot.off{background:#fff;color:#6B5A80;border:1.5px dashed #C9B3E3}
.slot.next{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--food)}
.switch{width:56px;height:34px;border:0;border-radius:17px;padding:3px;display:flex;transition:all .2s;background:#CBD5E1;justify-content:flex-start}
.switch.on{background:var(--food);justify-content:flex-end}
.switch span{width:28px;height:28px;border-radius:14px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.check{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;background:#fff;border:2px solid #CBD5E1}
.check.on{background:var(--ok);border:0}
.backdrop{position:absolute;inset:0;background:rgba(15,23,42,.45);z-index:30}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;
  z-index:31;padding:12px 20px 24px;display:flex;flex-direction:column;gap:16px}
.lbl{font-size:13px;font-weight:700}
.opt{min-height:44px;border-radius:12px;font-size:13.5px;font-weight:600;padding:6px 10px;background:#fff;border:1.5px solid var(--line)}
.opt.on{background:var(--medT);border:2px solid var(--med);color:#3B0764}
.seg{flex:1;height:48px;border-radius:12px;font-size:13.5px;font-weight:700;background:#fff;border:1.5px solid var(--line)}
.seg.on{background:var(--med);color:#fff;border:0}
.seg.locked{background:#F8FAFC;color:#64748B;border:1.5px dashed #CBD5E1}
.overlay{position:absolute;inset:0;background:#fff;z-index:40;display:flex;flex-direction:column;gap:14px;padding:28px 20px 24px;overflow-y:auto}
.box{border-radius:14px;padding:10px 12px;min-height:58px;display:flex;flex-direction:column;justify-content:center;transition:all .3s}
.box b{font-size:14px}
.box small{font-size:12px;font-weight:600}
.conn{width:2px;height:14px;margin:0 auto}
.toast{position:absolute;left:16px;right:16px;bottom:92px;z-index:50;background:var(--ink);color:#fff;border-radius:14px;
  padding:12px 16px;font-size:14px;font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>
<div class="phone" id="app"></div>

<script>
(function(){
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const TH=360/14;
const FORM={regular:'Regular tablet',er:'Extended-release',enteric:'Coated (enteric)',capsule:'Capsule',unsure:'Form not confirmed'};
const FORMS=[['regular','Regular tablet'],['er','Extended-release'],['enteric','Coated (enteric)'],['capsule','Capsule'],['unsure','Not sure']];
const PARTS=[['cup','Half-cup measure','Food path'],['crusher','Crusher box','Medicine path · wash separately'],
  ['mixer','Mixing bin + funnel','Where food and medicine meet'],['bowl','Bowl','Lifts out of the front bay']];

let S, timers=[], toastT=null, lastRot=null;
const blankDraft=()=>({name:'',form:'',am:false,pm:true,mode:'whole',vet:false});
function init(){
  const wheel=[];for(let i=0;i<14;i++)wheel.push(i!==0);
  return {screen:'welcome',found:false,tab:'today',phoneAway:false,cupsAm:1,cupsPm:1,foodCups:15.5,
    meds:[{name:'Joint tablet (Rx)',form:'regular',mode:'whole',am:true,pm:true}],
    wheel,turns:1,pmServed:false,outcome:'',servedSlot:'',servedEmpty:false,
    dispensing:false,step:0,sheet:false,draft:blankDraft(),
    cleaned:{cup:false,crusher:false,mixer:false,bowl:false},toast:'',synced:'5:48 PM'};
}
S=init();

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=c=>{const w=Math.floor(c);return (w?String(w):'')+((c%1)?'½':'')+(c<=1?' cup':' cups');};
const slotName=i=>DAYS[Math.floor(i/2)]+' '+(i%2?'PM':'AM');
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
function set(p){Object.assign(S,p);render();}
function flash(msg){set({toast:msg});clearTimeout(toastT);toastT=setTimeout(()=>set({toast:''}),2600);}
const syncMsg=w=>S.phoneAway?w+'. It syncs to PetMed when your phone is back in range.':w+' and synced to PetMed.';
const pmMeds=()=>S.meds.filter(m=>m.pm);
const medList=a=>a.length?a.map(m=>m.name+(m.mode==='crush'?' (crushed)':' (whole)')).join(' + '):'No medication';
const foodPct=()=>Math.max(0,Math.round(S.foodCups/24.9*100));

function buildSteps(){
  const pm=pmMeds(),hasMed=pm.length>0,slot=S.turns%14,loaded=S.wheel[slot],crush=pm.some(m=>m.mode==='crush'),n=S.cupsPm/0.5;
  const st=[{key:'bin',title:'Food level checked',body:'The distance sensor reads the bin at '+foodPct()+'%, enough for tonight.'}];
  if(hasMed)st.push({key:'wheel',title:'Medicine wheel turns',body:loaded
    ?'The '+slotName(slot)+' section lines up with the open drop slot and its dose falls into the medicine path.'
    :'The '+slotName(slot)+' section is empty, so dinner goes out without medication and you get an alert.'});
  st.push({key:'cup',title:'Dinner measured',body:'The half-cup measure fills '+n+(n===1?' time':' times')+' for '+fmt(S.cupsPm)+'.'});
  if(hasMed&&loaded)st.push({key:'crusher',title:crush?'Tablet crushed':'Crusher bypassed',body:crush
    ?'Crush mode is on because your vet confirmed this drug can be crushed.':'Default mode: the tablet stays whole.'});
  st.push({key:'mixer',title:'Food and medicine meet',body:(hasMed&&loaded)
    ?(crush?'The powder is stirred into the measured food.':'The whole tablet is folded into the measured food.')
    :'The food passes straight through.'});
  st.push({key:'bowl',title:'Served',body:'Everything slides down the chute into the bowl.'});
  return st;
}

/* ---------------- actions ---------------- */
const A={
  startPair(){set({screen:'pair',found:false});later(()=>set({found:true}),1800);},
  goWelcome(){set({screen:'welcome'});},
  finishPair(){set({screen:'app',tab:'today'});},
  tab(t){set({tab:t});},
  serve(){
    if(S.pmServed||S.dispensing)return;
    const n=buildSteps().length;set({dispensing:true,step:0});
    for(let k=1;k<=n;k++)later(()=>set({step:k}),k*1500);
  },
  outcome(o){
    const slot=S.turns%14,hasMed=pmMeds().length>0,wheel=S.wheel.slice(),wasEmpty=hasMed&&!wheel[slot];
    if(hasMed)wheel[slot]=false;
    set({dispensing:false,step:0,pmServed:true,outcome:o,wheel,turns:S.turns+1,foodCups:Math.max(0,S.foodCups-S.cupsPm),
      servedSlot:slotName(slot),servedEmpty:wasEmpty,synced:S.phoneAway?S.synced:'6:01 PM'});
    flash({finished:'Logged: Bailey finished dinner.',partial:'Logged: partial dose.',missed:'Logged: dinner not eaten.'}[o]);
  },
  cups(v){const [k,d]=v.split(':');const nv=Math.min(3,Math.max(.5,S[k]+Number(d)));const p={};p[k]=nv;
    if(!S.phoneAway)p.synced='just now';set(p);flash(syncMsg('Portion saved'));},
  slot(i){const w=S.wheel.slice();w[+i]=!w[+i];set({wheel:w});},
  refill(){set({wheel:Array(14).fill(true)});flash('Wheel marked full: 14 of 14 loaded.');},
  away(){const a=!S.phoneAway;set(a?{phoneAway:true}:{phoneAway:false,synced:'just now'});
    flash(a?'Phone away. PetMed keeps running the schedule.':'Phone back in range. Synced.');},
  clean(k){const c=Object.assign({},S.cleaned);c[k]=!c[k];set({cleaned:c});},
  restart(){timers.forEach(clearTimeout);timers=[];lastRot=null;S=init();render();},
  openSheet(){set({sheet:true,draft:blankDraft()});},
  closeSheet(){set({sheet:false});},
  form(k){const p={form:k};if(k!=='regular'){p.mode='whole';p.vet=false;}draft(p);},
  dAm(){draft({am:!S.draft.am});},
  dPm(){draft({pm:!S.draft.pm});},
  vet(){draft(S.draft.vet?{vet:false,mode:'whole'}:{vet:true});},
  mode(m){if(m==='crush'&&!(S.draft.form==='regular'&&S.draft.vet))return;draft({mode:m});},
  save(){
    const d=S.draft;if(!d.name.trim()||!d.form||!(d.am||d.pm))return;
    const ok=d.form==='regular'&&d.vet;
    const med={name:d.name.trim(),form:d.form,mode:(d.mode==='crush'&&ok)?'crush':'whole',am:d.am,pm:d.pm};
    const p={meds:S.meds.concat([med]),sheet:false,draft:blankDraft()};if(!S.phoneAway)p.synced='just now';
    set(p);flash(syncMsg(med.name+' saved'));
  }
};
function draft(p){S.draft=Object.assign({},S.draft,p);render();}

/* ---------------- icons ---------------- */
const IC={
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  wheel:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/>',
  device:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/>',
  check:'<path d="M5 12l5 5 9-10"/>',back:'<path d="M15 18l-6-6 6-6"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
  logo:'<path d="M4 14h16a8 8 0 0 1-16 0z"/><path d="M9 4h6a3 3 0 0 1 0 6H9a3 3 0 0 1 0-6z"/><path d="M12 4v6"/>'
};
const ic=(n,s,extra)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" ${extra||''}>${IC[n]}</svg>`;

/* ---------------- views ---------------- */
function vWelcome(){return `
<div class="screen" style="gap:26px">
  <div style="display:flex;align-items:center;gap:10px">
    <div style="width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center">${ic('logo',20)}</div>
    <span style="font-weight:800;font-size:20px;letter-spacing:-.3px">PetMed</span>
  </div>
  <div style="height:230px;border-radius:24px;background:var(--ground);display:flex;align-items:center;justify-content:center;flex:none">
    <div style="display:flex;flex-direction:column;align-items:center">
      <div style="width:88px;height:18px;border-radius:12px 12px 4px 4px;background:var(--med)"></div>
      <div style="width:118px;height:172px;border-radius:16px;background:#1E293B;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0 12px">
        <div style="width:86px;height:62px;border-radius:8px;background:#334155;display:flex;align-items:flex-end;overflow:hidden"><div style="width:100%;height:62%;background:#D97706"></div></div>
        <div style="width:86px;height:6px;border-radius:3px;background:#334155"></div>
        <div style="margin-top:auto;width:86px;height:50px;border-radius:10px;background:#0B1220;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px">
          <div style="width:60px;height:18px;border-radius:0 0 16px 16px;background:#CBD5E1"></div></div>
      </div>
      <div style="width:140px;height:8px;border-radius:4px;background:#CBD5E1"></div>
    </div>
  </div>
  <div>
    <h1 style="font-size:30px;line-height:1.15;letter-spacing:-.8px">One machine, one routine.</h1>
    <p class="muted" style="margin-top:10px;font-size:16px">Food and medicine, served together on schedule.</p>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px;font-size:14.5px">
    <div style="display:flex;gap:12px;align-items:center"><span class="dot" style="width:10px;height:10px;border-radius:5px;background:var(--food)"></span>Measured meals from a half-cup measure</div>
    <div style="display:flex;gap:12px;align-items:center"><span class="dot" style="width:10px;height:10px;border-radius:5px;background:var(--med)"></span>Each dose from a 7-day, 14-section medicine wheel</div>
    <div style="display:flex;gap:12px;align-items:center"><span class="dot" style="width:10px;height:10px;border-radius:5px;background:var(--ink)"></span>Runs on its own clock, even with your phone away</div>
  </div>
  <button class="btn" data-a="startPair" style="margin-top:auto;height:54px;font-size:16px;flex:none">Pair your PetMed</button>
</div>`;}

function vPair(){return `
<div class="screen" style="gap:18px;padding-top:28px">
  <button data-a="goWelcome" aria-label="Back" style="width:44px;height:44px;border:0;border-radius:12px;background:var(--ground);display:flex;align-items:center;justify-content:center">${ic('back',20)}</button>
  <h1 style="font-size:28px;margin-top:8px">Pair your PetMed</h1>
  <p class="muted">Keep your phone near the device. PetMed connects over Bluetooth.</p>
  ${!S.found?`
  <div style="border-radius:20px;background:var(--ground);padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:14px">
    <div style="width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--ink);animation:spin .9s linear infinite"></div>
    <div style="font-weight:700">Looking for PetMed nearby…</div>
  </div>`:`
  <div style="border-radius:20px;background:var(--ground);padding:20px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:14px">
      <div style="width:44px;height:44px;border-radius:12px;background:var(--okT);color:var(--ok);display:flex;align-items:center;justify-content:center">${ic('check',22,'style="stroke-width:2.4"')}</div>
      <div><div style="font-weight:700">PetMed-7F2A</div><div class="muted" style="font-size:13px">Found · Kitchen</div></div>
    </div>
    <p style="font-size:14px;color:#334155">Your schedule lives on the device. The app edits it; PetMed runs it, even when your phone is off or out of range.</p>
  </div>`}
  <button class="btn" data-a="finishPair" ${S.found?'':'disabled'} style="margin-top:auto;height:54px;font-size:16px">Continue</button>
</div>`;}

function vToday(){
  const pm=pmMeds(),am=S.meds.filter(m=>m.am),loaded=S.wheel.filter(Boolean).length;
  const next=S.pmServed?{label:'Tomorrow',when:'7:30 AM',what:'Breakfast · '+fmt(S.cupsAm),meds:medList(am)}
                       :{label:'Tonight',when:'6:00 PM',what:'Dinner · '+fmt(S.cupsPm),meds:medList(pm)};
  let chip=S.phoneAway?['On device','idle']:['Upcoming','idle'];
  if(S.pmServed)chip={finished:['Finished','ok'],partial:['Left some','warn'],missed:['Not eaten','bad']}[S.outcome]||['Served','ok'];
  let note='';
  if(S.pmServed&&S.servedEmpty)note=`<div class="note n-bad">The ${S.servedSlot} section was empty, so dinner went out without medication. Refill the wheel.</div>`;
  else if(S.pmServed&&S.outcome==='partial')note=`<div class="note n-warn">Partial dose logged. Don’t add another tablet unless your vet tells you to.</div>`;
  else if(S.pmServed&&S.outcome==='missed')note=`<div class="note n-bad">Dose likely missed. Call your vet before giving another tablet.</div>`;
  const pct=foodPct(),days=Math.floor(S.foodCups/(S.cupsAm+S.cupsPm));
  return `
<div class="pad">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
    <div><div class="muted" style="font-size:13px;font-weight:600">Monday, Oct 5 · 5:52 PM</div><h1 style="margin-top:2px">Good evening</h1></div>
    ${S.phoneAway
      ?`<div class="chip c-warn" style="display:flex;align-items:center;gap:6px;padding:6px 10px"><span class="dot" style="background:#D97706"></span>Phone away</div>`
      :`<div class="chip c-ok" style="display:flex;align-items:center;gap:6px;padding:6px 10px"><span class="dot" style="background:#16A34A"></span>Connected</div>`}
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <div style="width:44px;height:44px;border-radius:22px;background:var(--foodT);color:#92400E;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center">B</div>
    <div><div style="font-weight:700">Bailey</div><div class="muted" style="font-size:13px">Beagle · 12.4 kg</div></div>
  </div>
  ${S.phoneAway?`<div class="note n-warn"><b>Phone away.</b> PetMed still serves dinner at 6:00 PM from the schedule stored on the device.</div>`:''}
  <div style="border-radius:22px;background:#fff;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(15,23,42,.06)">
    <div class="cap">Next serving · ${next.label}</div>
    <div style="font-size:40px;font-weight:800;letter-spacing:-1.2px;line-height:1">${next.when}</div>
    <div style="display:flex;flex-direction:column;gap:6px;font-size:14.5px">
      <div style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:var(--food)"></span>${esc(next.what)}</div>
      <div style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:var(--med)"></span>${esc(next.meds)}</div>
    </div>
    ${!S.pmServed?`
      <button class="btn" data-a="serve" style="margin-top:4px">${S.phoneAway?'Skip ahead to 6:00 PM':'Serve dinner now'}</button>
      <div class="muted" style="font-size:12.5px;text-align:center">${S.phoneAway?'Demo: watch PetMed run on its own schedule.':'Or let PetMed serve it on time at 6:00 PM.'}</div>`
     :`<div class="muted" style="font-size:13px">Wheel advanced to ${slotName(S.turns%14)}.</div>`}
  </div>
  ${note}
  <div class="cap" style="margin-top:4px">Today</div>
  <div class="list">
    <div class="row"><div style="width:64px;font-weight:700;font-size:14px">7:30 AM</div>
      <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14.5px">Breakfast · 1 cup</div><div class="muted" style="font-size:12.5px">Joint tablet (Rx) · whole</div></div>
      <span class="chip c-ok">Finished</span></div>
    <div class="row"><div style="width:64px;font-weight:700;font-size:14px">6:00 PM</div>
      <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14.5px">Dinner · ${fmt(S.cupsPm)}</div>
        <div class="muted" style="font-size:12.5px">${esc(pm.length?pm.map(m=>m.name+' · '+(m.mode==='crush'?'crushed':'whole')).join(', '):'No medication')}</div></div>
      <span class="chip c-${chip[1]}">${chip[0]}</span></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
    <button class="mini" data-a="tab" data-v="device">
      <span style="font-size:12px;font-weight:700;color:#92400E">FOOD BIN</span>
      <span style="font-size:24px;font-weight:800">${pct}%</span>
      <span class="bar" style="background:var(--foodT)"><span style="width:${pct}%;background:var(--food)"></span></span>
      <span class="muted" style="font-size:12px">About ${days} days left</span>
    </button>
    <button class="mini" data-a="tab" data-v="wheel">
      <span style="font-size:12px;font-weight:700;color:#6B21A8">MEDICINE WHEEL</span>
      <span style="font-size:24px;font-weight:800">${loaded}/14</span>
      <span class="bar" style="background:var(--medT)"><span style="width:${Math.round(loaded/14*100)}%;background:var(--med)"></span></span>
      <span class="muted" style="font-size:12px">Next: ${slotName(S.turns%14)}</span>
    </button>
  </div>
</div>`;}

function syncLine(){return S.phoneAway?'Schedule stored on PetMed · changes sync when your phone is back':'Schedule stored on PetMed · synced '+S.synced;}

function vPlan(){
  const meal=(name,time,k)=>`
    <div class="row"><div style="flex:1"><div style="font-weight:700">${name}</div><div class="muted" style="font-size:13px">${time}</div></div>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="sq" data-a="cups" data-v="${k}:-0.5" aria-label="Less ${name.toLowerCase()}" ${S[k]<=.5?'disabled':''}>−</button>
        <div style="width:76px;text-align:center;font-weight:700;font-size:14px">${fmt(S[k])}</div>
        <button class="sq" data-a="cups" data-v="${k}:0.5" aria-label="More ${name.toLowerCase()}" ${S[k]>=3?'disabled':''}>+</button>
      </div></div>`;
  return `
<div class="pad">
  <div><h1>Plan</h1><p class="muted" style="margin-top:4px;font-size:14px">What PetMed serves Bailey every day.</p></div>
  <div class="cap" style="color:#92400E">Meals</div>
  <div class="list">${meal('Breakfast','7:30 AM','cupsAm')}${meal('Dinner','6:00 PM','cupsPm')}</div>
  <div class="cap" style="color:#6B21A8;margin-top:4px">Medication</div>
  <div class="list">${S.meds.map(m=>`
    <div class="row"><div style="flex:1;min-width:0"><div style="font-weight:700">${esc(m.name)}</div>
      <div class="muted" style="font-size:13px">${m.am&&m.pm?'Morning &amp; evening':(m.am?'Morning':'Evening')} · ${FORM[m.form]||''}</div></div>
      <span class="chip" style="${m.mode==='crush'?'background:var(--med);color:#fff':'background:var(--medT);color:#6B21A8'}">${m.mode==='crush'?'Crushed · vet OK':'Given whole'}</span></div>`).join('')}
  </div>
  <button class="btn-out" data-a="openSheet">+ Add medication</button>
  <div class="muted" style="display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:4px 2px">${ic('device',18,'style="flex:none;margin-top:1px"')}<span>${syncLine()}</span></div>
</div>`;}

function vWheel(){
  const C=150,R=124,r=62,next=S.turns%14,loaded=S.wheel.filter(Boolean).length;
  const pt=(rad,deg)=>{const a=deg*Math.PI/180;return [(C+rad*Math.cos(a)).toFixed(2),(C+rad*Math.sin(a)).toFixed(2)];};
  let segs='',labels='';
  for(let i=0;i<14;i++){
    const mid=i*TH-90,a0=mid-TH/2+.9,a1=mid+TH/2-.9,o0=pt(R,a0),o1=pt(R,a1),i1=pt(r,a1),i0=pt(r,a0),t=pt(93,mid),l=S.wheel[i];
    segs+=`<path d="M${o0.join(' ')} A${R} ${R} 0 0 1 ${o1.join(' ')} L${i1.join(' ')} A${r} ${r} 0 0 0 ${i0.join(' ')} Z"
      fill="${l?(i%2?'#6B21A8':'#9333EA'):'#FFFFFF'}" stroke="${i===next?'#B45309':'#D8C8EA'}" stroke-width="${i===next?3:1}"/>
      <text x="${t[0]}" y="${t[1]}" fill="${l?'#FFFFFF':'#75638F'}" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle">${i%2?'PM':'AM'}</text>`;
  }
  for(let d=0;d<7;d++){const p=pt(140,(2*d+.5)*TH-90);
    labels+=`<text x="${p[0]}" y="${p[1]}" fill="#4C1D95" font-size="11" font-weight="800" text-anchor="middle" dominant-baseline="middle">${DAYS[d]}</text>`;}
  const slot=i=>`<button class="slot ${S.wheel[i]?'on':'off'} ${i===next?'next':''}" data-a="slot" data-v="${i}"
      aria-label="${slotName(i)}: ${S.wheel[i]?'loaded':'empty'}${i===next?', next to drop':''}. Tap to toggle.">${i%2?'PM':'AM'} · ${S.wheel[i]?'Loaded':'Empty'}</button>`;
  return `
<div class="pad">
  <div><h1>Medicine wheel</h1><p class="muted" style="margin-top:4px;font-size:14px">14 sections: morning and evening for 7 days. One section drops per serving.</p></div>
  <div style="border-radius:22px;background:#fff;padding:18px 0 14px;display:flex;flex-direction:column;align-items:center;gap:10px">
    <svg width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="Medicine wheel, ${loaded} of 14 sections loaded, next ${slotName(next)}">
      <circle cx="150" cy="150" r="132" fill="#FAF6FE"/>
      <g id="wheelg" data-rot="${(-S.turns*TH).toFixed(3)}" style="transform-origin:150px 150px;transition:transform .9s cubic-bezier(.3,.7,.2,1)">${segs}${labels}</g>
      <circle cx="150" cy="150" r="54" fill="#fff"/>
      <text x="150" y="136" fill="#556070" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">NEXT</text>
      <text x="150" y="160" fill="#0F172A" font-size="18" font-weight="800" text-anchor="middle">${slotName(next)}</text>
      <path d="M141 1 L159 1 L150 16 Z" fill="#B45309"/>
    </svg>
    <div class="muted" style="display:flex;gap:16px;font-size:12px;flex-wrap:wrap;justify-content:center;padding:0 12px">
      <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--med)"></span>Loaded</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:#fff;border:1px solid #C9B3E3"></span>Empty</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid var(--food)"></span>Drop slot</span>
    </div>
  </div>
  <div style="border-radius:20px;background:#fff;padding:8px 14px">
    ${DAYS.map((d,di)=>`<div style="display:flex;align-items:center;gap:10px;padding:6px 0"><div style="width:40px;font-weight:700;font-size:14px">${d}</div>${slot(di*2)}${slot(di*2+1)}</div>`).join('')}
  </div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <div style="font-weight:700">Refilling</div>
    <div style="font-size:13.5px;color:#334155">Open the top lid, lift the wheel out, put one dose in each section and set it back. No pods or cartridges to buy: the wheel is reusable.</div>
    <button class="btn" data-a="refill" style="height:48px;background:var(--med)">I refilled the wheel</button>
  </div>
</div>`;}

function vDevice(){
  const pct=foodPct(),days=Math.floor(S.foodCups/(S.cupsAm+S.cupsPm));
  const cups=String(Math.round(S.foodCups*2)/2).replace('.5','½');
  return `
<div class="pad">
  <h1>Device</h1>
  <div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:44px;height:44px;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center">${ic('device',22)}</div>
      <div style="flex:1"><div style="font-weight:700">PetMed-7F2A · Kitchen</div><div class="muted" style="font-size:13px">${syncLine()}</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;border-top:1px solid var(--soft);padding-top:14px">
      <div style="flex:1"><div style="font-weight:600;font-size:14.5px">Simulate phone away</div><div class="muted" style="font-size:12.5px">Demo: PetMed keeps its own clock and schedule.</div></div>
      <button class="switch ${S.phoneAway?'on':''}" data-a="away" aria-pressed="${S.phoneAway}" aria-label="Simulate phone away"><span></span></button>
    </div>
  </div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-weight:700">Food bin</div><div style="font-weight:800;color:#92400E">${pct}%</div></div>
    <span class="bar" style="height:10px;border-radius:5px;background:var(--foodT)"><span style="width:${pct}%;background:var(--food)"></span></span>
    <div class="muted" style="font-size:13px">About ${cups} cups left, roughly ${days} days at current portions. Read by the distance sensor at the top of the bin.</div>
  </div>
  <div class="card" style="display:flex;flex-direction:column;gap:6px">
    <div style="font-weight:700">Cleaning</div>
    <div class="muted" style="font-size:13px;margin-bottom:4px">Open the handle and detach these parts so no food or medicine residue carries into the next dose.</div>
    ${PARTS.map(([k,n,note])=>`
      <button data-a="clean" data-v="${k}" aria-pressed="${S.cleaned[k]}" style="display:flex;align-items:center;gap:12px;min-height:48px;border:0;background:transparent;padding:4px 0;text-align:left">
        <span class="check ${S.cleaned[k]?'on':''}">${S.cleaned[k]?ic('check',14,'style="stroke:#fff;stroke-width:3.2"'):''}</span>
        <span style="flex:1"><span style="display:block;font-weight:600;font-size:14.5px">${n}</span><span class="muted" style="display:block;font-size:12.5px">${note}</span></span>
      </button>`).join('')}
  </div>
  <div class="card" style="font-size:13.5px;color:#334155"><b style="color:var(--ink)">No subscription.</b> Reusable medicine wheel, no refill pods or cartridges.</div>
  <button data-a="restart" style="height:48px;border:1.5px solid var(--line);border-radius:14px;background:transparent;color:#334155;font-size:14px;font-weight:700">Restart demo</button>
</div>`;}

function vNav(){
  const b=(t,icon,label)=>`<button data-a="tab" data-v="${t}" ${S.tab===t?'aria-current="page"':''}>${ic(icon,22)}${label}</button>`;
  return `<nav aria-label="Main">${b('today','home','Today')}${b('plan','list','Plan')}${b('wheel','wheel','Wheel')}${b('device','device','Device')}</nav>`;
}

function vSheet(){
  const d=S.draft,canCrush=d.form==='regular'&&d.vet,canSave=!!(d.name.trim()&&d.form&&(d.am||d.pm));
  const LOCK={'':'Pick the form first. PetMed gives every drug whole unless your vet says otherwise.',
    regular:d.vet?'Crush mode is available. You can still give it whole.':'Crushing unlocks only after your vet confirms this drug can be crushed.',
    er:'Extended-release tablets can release the whole dose at once when crushed. Whole only.',
    enteric:'The coating protects the stomach or the drug itself. Whole only.',
    capsule:'Capsules are always given whole.',unsure:'Until the form is confirmed, PetMed gives it whole.'};
  return `
<div class="backdrop" data-a="closeSheet"></div>
<div class="sheet" role="dialog" aria-label="Add medication">
  <div style="width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center"></div>
  <div style="display:flex;align-items:center;justify-content:space-between">
    <h2 style="margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px">Add medication</h2>
    <button data-a="closeSheet" aria-label="Close" style="width:44px;height:44px;border:0;border-radius:12px;background:var(--ground);display:flex;align-items:center;justify-content:center">${ic('x',18,'style="stroke-width:2.4"')}</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <label class="lbl" for="pm-med-name">Name</label>
    <input id="pm-med-name" type="text" value="${esc(d.name)}" placeholder="e.g. Thyroid tablet" autocomplete="off"
      style="height:48px;border-radius:12px;border:1.5px solid var(--line);padding:0 14px;font-size:15px;color:var(--ink)">
  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <div class="lbl">What form is it?</div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      ${FORMS.map(([k,l])=>`<button class="opt ${d.form===k?'on':''}" data-a="form" data-v="${k}" aria-pressed="${d.form===k}">${l}</button>`).join('')}
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <div class="lbl">When</div>
    <div style="display:flex;gap:8px">
      <button class="seg ${d.am?'on':''}" data-a="dAm" aria-pressed="${d.am}">Morning · 7:30</button>
      <button class="seg ${d.pm?'on':''}" data-a="dPm" aria-pressed="${d.pm}">Evening · 6:00</button>
    </div>
  </div>
  ${d.form==='regular'?`
  <label style="display:flex;gap:12px;align-items:flex-start;border-radius:14px;background:var(--ground);padding:14px;font-size:14px;cursor:pointer">
    <input type="checkbox" data-a="vet" ${d.vet?'checked':''} style="width:20px;height:20px;margin:1px 0 0;accent-color:#7E22CE;flex:none">
    <span>My vet confirmed this drug can be crushed.</span>
  </label>`:''}
  <div style="display:flex;flex-direction:column;gap:8px">
    <div class="lbl">How PetMed gives it</div>
    <div style="display:flex;gap:8px">
      <button class="seg ${d.mode!=='crush'?'on':''}" data-a="mode" data-v="whole" aria-pressed="${d.mode!=='crush'}">Whole in food</button>
      <button class="seg ${!canCrush?'locked':(d.mode==='crush'?'on':'')}" data-a="mode" data-v="crush" ${canCrush?'':'disabled'} aria-pressed="${d.mode==='crush'}">${canCrush?'Crush &amp; mix':'Crush · locked'}</button>
    </div>
    <div style="border-radius:12px;padding:10px 12px;font-size:13px;${canCrush?'background:var(--medT);color:#3B0764':'background:var(--ground);color:#334155'}">${LOCK[d.form]||LOCK['']}</div>
    <div class="muted" style="font-size:12px">Some drugs are unsafe for people to handle as dust, such as chemotherapy drugs and immunosuppressants. Ask your vet before turning on crushing.</div>
  </div>
  <button class="btn" id="pm-save" data-a="save" ${canSave?'':'disabled'} style="height:52px;flex:none">Save to PetMed</button>
</div>`;}

function vDispense(){
  const steps=buildSteps(),N=steps.length,crush=pmMeds().some(m=>m.mode==='crush');
  const COL={wheel:['#7E22CE','#F4EBFC'],crusher:['#7E22CE','#F4EBFC'],bin:['#B45309','#FEF3E7'],cup:['#B45309','#FEF3E7'],mixer:['#0F172A','#EEF1F5'],bowl:['#0F172A','#EEF1F5']};
  const box=(key,name)=>{
    const idx=steps.findIndex(s=>s.key===key),c=COL[key];
    let st='idle';if(idx===-1)st='skip';else if(idx<S.step||S.step>=N)st='done';else if(idx===S.step)st='active';
    const style={idle:'border:1.5px solid #E2E6EB;background:#fff;color:#556070',
      active:`border:2px solid ${c[0]};background:${c[1]};color:#0F172A;box-shadow:0 0 0 4px ${c[1]}`,
      done:`border:1.5px solid ${c[0]};background:#fff;color:#0F172A`,skip:'border:1.5px dashed #E2E6EB;background:#F8FAFC;color:#64748B'}[st];
    const sub={idle:'color:#64748B',active:`color:${c[0]};animation:pulse 1s ease-in-out infinite`,done:'color:#166534',skip:'color:#64748B'}[st];
    const lab={idle:'Waiting',active:'Working…',done:'Done',skip:'Not used tonight'}[st];
    return `<div class="box" style="${style}"><b>${name}</b><small style="${sub}">${lab}</small></div>`;
  };
  const cur=steps[Math.min(S.step,N-1)],num=Math.min(S.step+1,N);
  return `
<div class="overlay">
  <div>
    <div class="muted" style="font-size:12.5px;font-weight:700">${S.phoneAway?'6:00 PM · Running from PetMed’s own schedule (phone away)':'5:52 PM · Started from your phone'}</div>
    <h2 style="margin:2px 0 0;font-size:26px;font-weight:800;letter-spacing:-.6px">Serving dinner</h2>
    <div class="muted" style="font-size:13px;margin-top:4px">Medicine stays in its own path until the mixing chamber.</div>
  </div>
  <div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:10px">
      <div style="font-size:11px;font-weight:800;letter-spacing:.8px;color:#6B21A8;padding-bottom:6px">MEDICINE PATH</div>
      <div style="font-size:11px;font-weight:800;letter-spacing:.8px;color:#92400E;padding-bottom:6px">FOOD PATH</div>
      ${box('wheel','Medicine wheel')}${box('bin','Food bin')}
      <div class="conn" style="background:#C9B3E3"></div><div class="conn" style="background:#F0C9A0"></div>
      ${box('crusher',crush?'Crusher':'Crusher (bypassed)')}${box('cup','Half-cup measure')}
      <div class="conn" style="background:#C9B3E3"></div><div class="conn" style="background:#F0C9A0"></div>
    </div>
    ${box('mixer','Mixing chamber')}<div class="conn" style="background:#CBD5E1"></div>${box('bowl','Bowl')}
  </div>
  ${S.step<N?`
  <div style="border-radius:18px;background:var(--ground);padding:16px;display:flex;flex-direction:column;gap:8px">
    <span class="bar" style="background:var(--line)"><span style="width:${Math.round(num/N*100)}%;background:var(--ink)"></span></span>
    <div class="muted" style="font-size:12px;font-weight:700">Step ${num} of ${N}</div>
    <div style="font-size:17px;font-weight:800">${cur.title}</div>
    <div style="font-size:13.5px;color:#334155">${cur.body}</div>
  </div>`:`
  <div style="border-radius:18px;background:var(--ground);padding:16px;display:flex;flex-direction:column;gap:10px">
    <div style="font-size:17px;font-weight:800">Dinner is in the bowl. Did Bailey finish it?</div>
    <div style="font-size:13px;color:#334155">Your answer is logged with tonight's dose.</div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <button data-a="outcome" data-v="finished" style="height:48px;border:0;border-radius:12px;background:var(--ok);color:#fff;font-size:13.5px;font-weight:700">Finished</button>
      <button data-a="outcome" data-v="partial" style="height:48px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:13.5px;font-weight:700">Left some</button>
      <button data-a="outcome" data-v="missed" style="height:48px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:13.5px;font-weight:700">Didn't eat</button>
    </div>
  </div>`}
</div>`;}

/* ---------------- render ---------------- */
const root=document.getElementById('app');
function render(){
  const oldC=root.querySelector('.content'),oldScroll=oldC?oldC.scrollTop:0,oldTab=root.dataset.tab;
  const oldSheet=root.querySelector('.sheet'),sheetScroll=oldSheet?oldSheet.scrollTop:0;
  const focusName=document.activeElement&&document.activeElement.id==='pm-med-name';
  const caret=focusName?document.activeElement.selectionStart:0;
  let h='';
  if(S.screen==='welcome')h=vWelcome();
  else if(S.screen==='pair')h=vPair();
  else{
    const tabs={today:vToday,plan:vPlan,wheel:vWheel,device:vDevice};
    h=`<div class="content">${tabs[S.tab]()}</div>${vNav()}`;
    if(S.sheet)h+=vSheet();
    if(S.dispensing)h+=vDispense();
  }
  if(S.toast)h+=`<div class="toast" role="status">${esc(S.toast)}</div>`;
  root.innerHTML=h;
  root.dataset.tab=S.tab;
  const c=root.querySelector('.content');if(c&&oldTab===S.tab)c.scrollTop=oldScroll;
  const sh=root.querySelector('.sheet');if(sh)sh.scrollTop=sheetScroll;
  if(focusName){const inp=document.getElementById('pm-med-name');if(inp){inp.focus();inp.setSelectionRange(caret,caret);}}
  const g=document.getElementById('wheelg');
  if(g){const target=parseFloat(g.dataset.rot);
    if(lastRot!==null&&lastRot!==target){g.style.transition='none';g.style.transform=`rotate(${lastRot}deg)`;
      g.getBoundingClientRect();g.style.transition='';}
    requestAnimationFrame(()=>{g.style.transform=`rotate(${target}deg)`;});lastRot=target;}
}
root.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const fn=A[el.dataset.a];if(fn)fn(el.dataset.v);
});
root.addEventListener('input',e=>{
  if(e.target.id!=='pm-med-name')return;
  S.draft=Object.assign({},S.draft,{name:e.target.value});
  const d=S.draft,b=document.getElementById('pm-save');
  if(b)b.disabled=!(d.name.trim()&&d.form&&(d.am||d.pm));
});
render();
})();
</script>
</body>
</html>
